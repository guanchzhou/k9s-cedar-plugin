name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck --severity=warning install.sh uninstall.sh plugin.sh tests/*.sh tests/mocks/kubectl

      - name: Install cedar
        run: cargo install --locked cedar-policy-cli --version 4.12.0

      - name: Offline tests
        env:
          CEDAR_K9S_NO_OPEN: "1"
        run: ./tests/test-offline.sh
